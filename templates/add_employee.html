{% extends "base.html" %}

{% block title %}
Add Employee
{% endblock %}

{% block content %}

<style>

.employee-section{
    min-height:75vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.employee-card{
    width:100%;
    max-width:600px;
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

</style>

<section class="employee-section">

<div class="card employee-card">

<div class="card-body p-4">

<h2 class="text-center mb-4 text-primary">
Add Employee
</h2>

<!-- Flash Messages -->

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for msg in messages %}

<div class="alert alert-success alert-dismissible fade show">

{{ msg }}

<button type="button"
class="btn-close"
data-bs-dismiss="alert"></button>

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form action="/employees" method="POST">

<div class="mb-3">

<label class="form-label">
Employee ID
</label>

<input
type="number"
class="form-control"
name="eid"
placeholder="Enter Employee ID"
required>

</div>

<div class="mb-3">

<label class="form-label">
Employee Name
</label>

<input
type="text"
class="form-control"
name="ename"
placeholder="Enter Employee Name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Department
</label>

<input
type="text"
class="form-control"
name="edept"
placeholder="Enter Department"
required>

</div>

<div class="mb-3">

<label class="form-label">
Salary
</label>

<input
type="number"
class="form-control"
name="esalary"
placeholder="Enter Salary"
min="0"
required>

</div>

<div class="mb-4">

<label class="form-label">
Phone Number
</label>

<input
type="tel"
class="form-control"
name="ephone"
placeholder="Enter 10 Digit Phone Number"
maxlength="10"
pattern="[0-9]{10}"
required>

</div>

<div class="d-grid mb-3">

<button
type="submit"
class="btn btn-warning btn-lg">

Add Employee

</button>

</div>

<div class="text-center">

<a href="/view_employee"
class="btn btn-outline-primary">

View Employees

</a>

</div>

</form>

</div>

</div>

</section>

{% endblock %}
